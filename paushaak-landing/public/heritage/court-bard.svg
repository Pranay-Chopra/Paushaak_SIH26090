<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="49" fill="#17264A" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#EAE0C4" stroke-width="1" opacity="0.6" />

  <!-- seated bard, simplified flat silhouette -->
  <g fill="#EAE0C4">
    <!-- turban -->
    <path d="M50 22 C 40 22, 34 29, 35 36 C 43 33, 57 33, 65 36 C 66 29, 60 22, 50 22 Z" />
    <circle cx="50" cy="26" r="2" fill="#17264A" />
    <!-- head -->
    <circle cx="50" cy="40" r="8" />
    <!-- torso / robe -->
    <path d="M34 78 C 34 58, 40 48, 50 48 C 60 48, 66 58, 66 78 Z" />
    <!-- raised arm -->
    <path d="M62 54 C 68 50, 73 44, 74 37" stroke="#EAE0C4" stroke-width="3.2" fill="none" stroke-linecap="round" />
    <!-- instrument (tanpura-like) -->
    <ellipse cx="37" cy="66" rx="7" ry="10" />
    <rect x="35.5" y="40" width="3" height="27" rx="1.4" />
    <path
      d="M38 55 C 45 57, 52 60, 58 66"
      stroke="#EAE0C4"
      stroke-width="1.6"
      fill="none"
      stroke-linecap="round"
      opacity="0.8"
    />
  </g>
</svg>

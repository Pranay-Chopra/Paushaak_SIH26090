<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <g id="corner-star">
      <path d="M0,-10 L4.5,0 L0,10 L-4.5,0 Z" fill="none" stroke="#17264A" stroke-width="0.9" opacity="0.26" />
      <path d="M-10,0 L0,4.5 L10,0 L0,-4.5 Z" fill="none" stroke="#17264A" stroke-width="0.9" opacity="0.26" />
      <path d="M0,-16 L0,-11 M0,11 L0,16 M-16,0 L-11,0 M11,0 L16,0" stroke="#17264A" stroke-width="0.7" opacity="0.2" />
      <circle r="1.6" fill="#C3AE79" opacity="0.55" />
    </g>
  </defs>

  <!-- secondary diamond-star lattice at each shared tile corner, filling the
       gaps between the main flowers so the repeat doesn't read as bare squares -->
  <use href="#corner-star" x="0" y="0" />
  <use href="#corner-star" x="120" y="0" />
  <use href="#corner-star" x="0" y="120" />
  <use href="#corner-star" x="120" y="120" />

  <!-- fine scroll flourish linking each corner star toward the field -->
  <g fill="none" stroke="#17264A" stroke-width="0.7" opacity="0.2">
    <path d="M14,14 C22,20 26,30 24,38" />
    <path d="M106,14 C98,20 94,30 96,38" />
    <path d="M14,106 C22,100 26,90 24,82" />
    <path d="M106,106 C98,100 94,90 96,82" />
  </g>

  <!-- curling vine tendrils, each running from the centre motif to a tile
       edge-midpoint so they connect seamlessly into neighbouring tiles -->
  <g fill="none" stroke="#17264A" stroke-width="1" stroke-linecap="round" opacity="0.28">
    <path d="M60,42 C64,32 56,24 62,12 C65,6 58,2 60,0" />
    <path d="M78,60 C88,56 96,64 108,58 C114,55 118,62 120,60" />
    <path d="M60,78 C56,88 64,96 58,108 C55,114 62,118 60,120" />
    <path d="M42,60 C32,64 24,56 12,62 C6,65 2,58 0,60" />
  </g>

  <!-- secondary bud pair further along each vine -->
  <g fill="#17264A" opacity="0.24">
    <circle cx="61" cy="8" r="2" />
    <circle cx="57" cy="18" r="1.6" />
    <circle cx="113" cy="59" r="2" />
    <circle cx="103" cy="61" r="1.6" />
    <circle cx="59" cy="112" r="2" />
    <circle cx="63" cy="102" r="1.6" />
    <circle cx="7" cy="61" r="2" />
    <circle cx="17" cy="59" r="1.6" />
  </g>

  <!-- leaves along each vine, closer to the centre motif -->
  <g fill="#C3AE79" opacity="0.34">
    <ellipse cx="59" cy="30" rx="3.4" ry="7.5" transform="rotate(18 59 30)" />
    <ellipse cx="90" cy="61" rx="7.5" ry="3.4" transform="rotate(-12 90 61)" />
    <ellipse cx="61" cy="90" rx="3.4" ry="7.5" transform="rotate(-18 61 90)" />
    <ellipse cx="30" cy="59" rx="7.5" ry="3.4" transform="rotate(12 30 59)" />
  </g>

  <!-- outer ring of small petals encircling the centre motif -->
  <g fill="none" stroke="#17264A" stroke-width="0.9" opacity="0.3">
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(0 60 60)" />
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(45 60 60)" />
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(90 60 60)" />
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(135 60 60)" />
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(180 60 60)" />
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(225 60 60)" />
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(270 60 60)" />
    <ellipse cx="60" cy="42" rx="4" ry="8" transform="rotate(315 60 60)" />
  </g>

  <!-- fine dotted halo ring, further out, for extra detail density -->
  <g fill="#17264A" opacity="0.22">
    <circle cx="60" cy="26" r="1" />
    <circle cx="77" cy="32" r="1" />
    <circle cx="88" cy="49" r="1" />
    <circle cx="88" cy="71" r="1" />
    <circle cx="77" cy="88" r="1" />
    <circle cx="60" cy="94" r="1" />
    <circle cx="43" cy="88" r="1" />
    <circle cx="32" cy="71" r="1" />
    <circle cx="32" cy="49" r="1" />
    <circle cx="43" cy="32" r="1" />
  </g>

  <!-- inner rosette, two tiers -->
  <g fill="#17264A" opacity="0.32">
    <ellipse cx="60" cy="51" rx="3.2" ry="7" />
    <ellipse cx="69" cy="60" rx="7" ry="3.2" />
    <ellipse cx="60" cy="69" rx="3.2" ry="7" />
    <ellipse cx="51" cy="60" rx="7" ry="3.2" />
  </g>
  <g fill="#C3AE79" opacity="0.4">
    <ellipse cx="60" cy="54" rx="2" ry="4.2" transform="rotate(45 60 60)" />
    <ellipse cx="60" cy="54" rx="2" ry="4.2" transform="rotate(135 60 60)" />
    <ellipse cx="60" cy="54" rx="2" ry="4.2" transform="rotate(225 60 60)" />
    <ellipse cx="60" cy="54" rx="2" ry="4.2" transform="rotate(315 60 60)" />
  </g>
  <circle cx="60" cy="60" r="3" fill="#17264A" opacity="0.5" />
  <circle cx="60" cy="60" r="1.3" fill="#C3AE79" opacity="0.8" />
</svg>
